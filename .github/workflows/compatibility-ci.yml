name: Compatibility CI keyless validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mock-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AgentSEO
        run: python -m pip install -e "apps/backend[dev]"
      - name: Semantic diff and keyless pipeline
        run: |
          agentseo diff --baseline examples/compatibility-ci-demo/baseline/openapi.yaml --candidate examples/compatibility-ci-demo/candidate-safe/openapi.yaml
          agentseo compare --baseline examples/compatibility-ci-demo/baseline/openapi.yaml --candidate examples/compatibility-ci-demo/candidate-safe/openapi.yaml --tasks examples/compatibility-ci-demo/contracts --models mock:reliable --max-cost 0
