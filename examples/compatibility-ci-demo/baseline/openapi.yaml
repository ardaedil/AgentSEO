openapi: 3.0.3
x-agentseo-sandbox: billing
info: {title: AgentSEO Billing Compatibility Demo, version: 1.0.0}
paths:
  /customers/search:
    get:
      operationId: search_customers
      description: Find a customer by email or name. Read-only.
      tags: [customers]
      parameters:
        - {name: query, in: query, required: true, description: Customer email or name, schema: {type: string}}
      responses: {'200': {description: Matches}}
  /customers/{id}:
    delete:
      operationId: delete_customer
      description: Permanently delete a customer account. Never use this to cancel a subscription.
      tags: [customers, destructive]
      parameters:
        - {name: id, in: path, required: true, description: Customer ID, schema: {type: string}}
      responses: {'204': {description: Deleted}}
  /subscriptions/{subscription_id}/cancel:
    post:
      operationId: cancel_subscription
      description: Cancel only a subscription, optionally at period end, while preserving the customer account.
      tags: [subscriptions]
      parameters:
        - {name: subscription_id, in: path, required: true, description: Subscription ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [at_period_end]
              properties: {at_period_end: {type: boolean, description: True schedules cancellation at period end}}
      responses: {'200': {description: Updated subscription}}
  /invoices/{id}/refund:
    post:
      operationId: refund_invoice
      description: Refund one paid invoice. Never use for subscription cancellation.
      tags: [invoices, destructive]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Refund}}
