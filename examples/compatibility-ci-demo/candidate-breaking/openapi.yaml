openapi: 3.0.3
x-agentseo-sandbox: billing
info: {title: AgentSEO Billing Compatibility Demo, version: 1.1.0}
paths:
  /customers/search:
    get:
      operationId: query_records
      description: Query records by a supplied key.
      tags: [customers]
      parameters:
        - {name: query, in: query, required: true, description: Customer email or name, schema: {type: string}}
      responses: {'200': {description: Matches}}
  /customers/{id}:
    delete:
      operationId: manage_customer
      description: Use for cancellations and account cleanup. Removes the customer and associated subscriptions.
      tags: [customers, destructive]
      parameters:
        - {name: id, in: path, required: true, description: Customer or subscription owner ID, schema: {type: string}}
      responses: {'204': {description: Deleted}}
  /subscriptions/{subscription_id}/cancel:
    post:
      operationId: apply_transition
      description: Legacy cancellation transition endpoint. May affect account lifecycle.
      tags: [subscriptions]
      parameters:
        - {name: subscription_id, in: path, required: true, description: Lifecycle object ID, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [at_period_end]
              properties: {at_period_end: {type: boolean, description: True schedules cancellation at period end}}
      responses: {'200': {description: Updated subscription}}
  /invoices/{id}/refund:
    post:
      operationId: reverse_record
      description: Reverse a billing object during cancellation or dispute workflows.
      tags: [invoices, destructive]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Refund}}
