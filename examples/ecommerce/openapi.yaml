openapi: 3.0.3
info: {title: AgentSEO Ecommerce Sandbox, version: 1.0.0}
paths:
  /customers/search:
    get:
      operationId: search_customers
      summary: Search customers
      parameters: [{name: query, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Matches}}
  /customers/{id}:
    get:
      operationId: get_customer
      summary: Get customer by ID
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Customer}}
    delete:
      operationId: delete_customer
      summary: Permanently delete a customer and personal data
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Deleted}}
  /orders:
    get:
      operationId: list_orders
      summary: List orders for a customer
      parameters: [{name: customer_id, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Orders}}
  /orders/{id}:
    get:
      operationId: get_order
      summary: Get an order by ID
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Order}}
  /orders/{order_id}/refund:
    post:
      operationId: refund_order
      summary: Refund one order
      description: Destructive financial action. Requires a uniquely identified order.
      parameters: [{name: order_id, in: path, required: true, schema: {type: string}}]
      responses: {'201': {description: Refund}}
  /shipments:
    get:
      operationId: list_shipments
      summary: List shipments by order or delivery status
      parameters:
        - {name: order_id, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string}}
      responses: {'200': {description: Shipments}}

