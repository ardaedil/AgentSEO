openapi: 3.1.0
info: {title: AgentSEO CRM Sandbox, version: 1.0.0}
paths:
  /companies/search:
    get:
      operationId: search_companies
      summary: Search companies by name
      parameters: [{name: query, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Companies}}
  /companies/{id}:
    get:
      operationId: get_company
      summary: Get company by ID
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Company}}
  /opportunities:
    get:
      operationId: list_opportunities
      summary: Filter sales opportunities
      parameters:
        - {name: company_id, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: min_value, in: query, required: false, schema: {type: number}}
      responses: {'200': {description: Opportunities}}
  /opportunities/{opportunity_id}/owner:
    patch:
      operationId: assign_opportunity
      summary: Assign one opportunity to an account owner
      parameters: [{name: opportunity_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [owner_id], properties: {owner_id: {type: string}}}}}
      responses: {'200': {description: Updated opportunity}}
  /opportunities/{id}:
    delete:
      operationId: delete_opportunity
      summary: Permanently delete an opportunity
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Deleted}}
  /owners/search:
    get:
      operationId: search_owners
      summary: Search account owners by name
      parameters: [{name: query, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Owners}}
  /contacts:
    get:
      operationId: list_contacts
      summary: List contacts for a company
      parameters: [{name: company_id, in: query, required: false, schema: {type: string}}]
      responses: {'200': {description: Contacts}}

